# Praxis intercept targets.
#
# Each [section] is a single intercept target. The section header is the
# agent short_name used to route captured traffic to the matching agent
# connector. Comment a section out (prefix every line with #) to disable
# it. Use the "Reset to defaults" option to restore this file's original
# contents.
#
# Fields per target:
#   domains     = ["host1", "host2"]               (required, one or more)
#   url_pattern = "regex matched against URL path" (optional)

[auggie]
domains = ["api.augmentcode.com"]

[claudecode]
domains = ["api.anthropic.com", "a-api.anthropic.com"]
url_pattern = "messages"

[claudedesktop]
domains = ["api.anthropic.com", "a-api.anthropic.com"]
url_pattern = "messages"

[cline]
domains = ["api.cline.bot"]

[copilot]
domains = [
    "api.githubcopilot.com",
    "individual.githubcopilot.com",
    "business.githubcopilot.com",
    "enterprise.githubcopilot.com",
]

[cursor]
domains = ["agent.api5.cursor.sh", "api2.cursor.sh", "cursor.sh"]

[droid]
domains = [
    "api.factory.ai",
    "staging.api.factory.ai",
    "preprod.api.factory.ai",
    "dev.api.factory.ai",
]

[gemini]
domains = ["generativelanguage.googleapis.com", "cloudcode-pa.googleapis.com"]

[grok]
domains = ["cli-chat-proxy.grok.com", "api.x.ai"]

[junie]
domains = ["ingrazzio-cloud-prod.labs.jb.gg"]

[kilo]
domains = ["ai-gateway.kilo.ai"]

[kimi]
domains = ["api.kimi.com", "api.moonshot.ai", "api.moonshot.cn"]

[kiro]
domains = [
    "q.us-east-1.amazonaws.com",
    "q.eu-central-1.amazonaws.com",
    "runtime.us-east-1.kiro.dev",
    "runtime.eu-central-1.kiro.dev",
]

[m365copilot]
domains = ["substrate.office.com"]
url_pattern = "m365Copilot/Chathub"

[qwen]
domains = ["chat.qwen.ai", "dashscope.aliyuncs.com", "maas.aliyuncs.com"]

[vibe]
domains = ["api.mistral.ai"]
