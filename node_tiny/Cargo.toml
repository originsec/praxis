[package]
name = "praxis_node_tiny"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Minimal Praxis node - bare-bones runtime hosting only the Praxis agent over ACP sessions"

[[bin]]
name = "praxis_node_tiny"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "io-util", "time", "signal", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
once_cell = "1"
sysinfo = "0.38"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
lapin = "4.5"
agent-client-protocol = { version = "0.11", features = ["unstable_session_close", "unstable_session_model", "unstable_session_usage"] }
common = { package = "praxis_common", path = "../common" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["user"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
