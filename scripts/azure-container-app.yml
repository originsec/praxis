#
# Azure Container Apps Configuration for Praxis
# This file can be used with: az containerapp create --yaml azure-container-app.yml
#

properties:
  managedEnvironmentId: /subscriptions/{subscription-id}/resourceGroups/{resource-group}/providers/Microsoft.App/managedEnvironments/{environment-name}
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 8080
      transport: auto
      allowInsecure: false
    registries:
      - server: {acr-name}.azurecr.io
        username: {acr-name}
        passwordSecretRef: acr-password
    secrets:
      - name: acr-password
        value: {acr-password}
      - name: rabbitmq-password
        value: praxis
  template:
    containers:
      - name: praxis
        image: {acr-name}.azurecr.io/praxis:latest
        env:
          - name: PRAXIS_RABBITMQ_URL
            value: amqp://praxis:praxis@praxis-rabbitmq:5672
          - name: RUST_LOG
            value: info
        resources:
          cpu: 1.0
          memory: 2.0Gi
    scale:
      minReplicas: 1
      maxReplicas: 3
      rules:
        - name: http-rule
          http:
            metadata:
              concurrentRequests: "100"
