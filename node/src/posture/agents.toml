# Praxis endpoint posture definitions, keyed by agent short_name.
#
# For each agent:
#   format     default document format for sources ("json" or "toml")
#   sources    config locations in precedence order, HIGHEST FIRST. Each has
#              a scope ("managed", "user" or "defaults"), an optional os
#              ("linux", "macos", "windows") and exactly one of:
#                path      file path; "~/" = per user home, "*" = drop-in glob,
#                          %VAR% / ${VAR} expand from the node environment
#                plist     macOS managed preferences domain (optional `value`
#                          = key inside the plist, `base64 = true` when that
#                          key holds an encoded document)
#                registry  Windows key (HKLM\... or HKCU\...); `value` names a
#                          value holding the whole document, otherwise every
#                          value under the key is a policy key
#              env_override names an env var that replaces `path` when set.
#   telemetry  enabled / endpoints / keys: dotted setting paths, or "$VAR" for
#              the node's own process environment
#   sandbox    keys: dotted setting paths or "$VAR"
#   categories top-level policy key -> category label for policy summaries
#   notes      caveats shown with the agent's posture
#
# Every location below is taken from vendor documentation; the URL is noted
# above each agent.

# Claude Code
#   https://code.claude.com/docs/en/managed-settings
#   https://code.claude.com/docs/en/settings
#   https://code.claude.com/docs/en/monitoring-usage
#   https://code.claude.com/docs/en/permissions
#   https://code.claude.com/docs/en/sandboxing
[claudecode]
format = "json"
notes = [
    "By default Claude Code applies only the highest-priority managed source that defines any policy (managedSourcesBehavior = first-wins: server-managed > MDM/HKLM > managed files > HKCU); Praxis reports per-key precedence across all of them.",
    "Server-managed settings from the claude.ai console are not visible on the endpoint.",
    "HKCU\\SOFTWARE\\Policies\\ClaudeCode is user-writable and only used when no admin source supplies policy.",
]

[[claudecode.sources]]
scope = "managed"
os = "macos"
plist = "com.anthropic.claudecode"

[[claudecode.sources]]
scope = "managed"
os = "windows"
registry = 'HKLM\SOFTWARE\Policies\ClaudeCode'
value = "Settings"

[[claudecode.sources]]
scope = "managed"
os = "macos"
path = "/Library/Application Support/ClaudeCode/managed-settings.json"

[[claudecode.sources]]
scope = "managed"
os = "macos"
path = "/Library/Application Support/ClaudeCode/managed-settings.d/*.json"

[[claudecode.sources]]
scope = "managed"
os = "macos"
path = "/Library/Application Support/ClaudeCode/managed-mcp.json"

[[claudecode.sources]]
scope = "managed"
os = "linux"
path = "/etc/claude-code/managed-settings.json"

[[claudecode.sources]]
scope = "managed"
os = "linux"
path = "/etc/claude-code/managed-settings.d/*.json"

[[claudecode.sources]]
scope = "managed"
os = "linux"
path = "/etc/claude-code/managed-mcp.json"

[[claudecode.sources]]
scope = "managed"
os = "windows"
path = 'C:\Program Files\ClaudeCode\managed-settings.json'

[[claudecode.sources]]
scope = "managed"
os = "windows"
path = 'C:\Program Files\ClaudeCode\managed-settings.d\*.json'

[[claudecode.sources]]
scope = "managed"
os = "windows"
path = 'C:\Program Files\ClaudeCode\managed-mcp.json'

[[claudecode.sources]]
scope = "managed"
os = "windows"
registry = 'HKCU\SOFTWARE\Policies\ClaudeCode'
value = "Settings"

[[claudecode.sources]]
scope = "user"
path = "~/.claude/settings.json"

[claudecode.telemetry]
enabled = ["env.CLAUDE_CODE_ENABLE_TELEMETRY", "$CLAUDE_CODE_ENABLE_TELEMETRY"]
endpoints = [
    "env.OTEL_EXPORTER_OTLP_ENDPOINT",
    "env.OTEL_EXPORTER_OTLP_METRICS_ENDPOINT",
    "env.OTEL_EXPORTER_OTLP_LOGS_ENDPOINT",
    "env.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT",
    "$OTEL_EXPORTER_OTLP_ENDPOINT",
    "$OTEL_EXPORTER_OTLP_METRICS_ENDPOINT",
    "$OTEL_EXPORTER_OTLP_LOGS_ENDPOINT",
    "$OTEL_EXPORTER_OTLP_TRACES_ENDPOINT",
]
keys = [
    "env.OTEL_METRICS_EXPORTER",
    "env.OTEL_LOGS_EXPORTER",
    "env.OTEL_TRACES_EXPORTER",
    "env.OTEL_EXPORTER_OTLP_PROTOCOL",
    "env.OTEL_EXPORTER_OTLP_HEADERS",
    "env.OTEL_LOG_USER_PROMPTS",
    "env.OTEL_LOG_TOOL_DETAILS",
    "env.OTEL_LOG_TOOL_CONTENT",
    "env.OTEL_LOG_ASSISTANT_RESPONSES",
    "env.OTEL_LOG_RAW_API_BODIES",
    "otelHeadersHelper",
    "$OTEL_METRICS_EXPORTER",
    "$OTEL_LOGS_EXPORTER",
    "$OTEL_TRACES_EXPORTER",
    "$OTEL_LOG_USER_PROMPTS",
]

[claudecode.sandbox]
keys = [
    "permissions.defaultMode",
    "permissions.disableBypassPermissionsMode",
    "permissions.disableAutoMode",
    "permissions.allow",
    "permissions.ask",
    "permissions.deny",
    "allowManagedPermissionRulesOnly",
    "sandbox.enabled",
    "sandbox.autoAllowBashIfSandboxed",
    "sandbox.allowUnsandboxedCommands",
    "sandbox.failIfUnavailable",
    "sandbox.network.allowedDomains",
    "sandbox.network.allowManagedDomainsOnly",
    "sandbox.filesystem.allowManagedReadPathsOnly",
]

[claudecode.categories]
permissions = "permissions"
allowManagedPermissionRulesOnly = "permissions"
sandbox = "sandbox"
hooks = "hooks"
allowManagedHooksOnly = "hooks"
disableAllHooks = "hooks"
mcpServers = "mcp"
allowManagedMcpServersOnly = "mcp"
allowedMcpServers = "mcp"
deniedMcpServers = "mcp"
managedMcpServers = "mcp"
allowAllClaudeAiMcps = "mcp"
model = "model"
availableModels = "model"
deniedModels = "model"
forceLoginMethod = "login"
forceLoginOrgUUID = "login"
apiKeyHelper = "login"
env = "environment"
otelHeadersHelper = "telemetry"
strictKnownMarketplaces = "plugins"
blockedMarketplaces = "plugins"
strictPluginOnlyCustomization = "plugins"
enabledPlugins = "plugins"
requiredMinimumVersion = "updates"
managedSourcesBehavior = "policy"
forceRemoteSettingsRefresh = "policy"
policyHelper = "policy"

