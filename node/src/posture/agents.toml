    "allowedWorkspaceFolders",
]

[claudedesktop.categories]
allowedWorkspaceFolders = "permissions"
disableBypassPermissionsMode = "permissions"
autoModeEnabled = "permissions"
disabledBuiltinTools = "permissions"
builtinToolPolicy = "permissions"
managedMcpServers = "mcp"
isLocalDevMcpEnabled = "mcp"
isDesktopExtensionEnabled = "mcp"
isDesktopExtensionDirectoryEnabled = "mcp"
forceLoginOrgUUID = "login"
disableAutoUpdates = "updates"
