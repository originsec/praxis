# Gemini CLI
#   https://geminicli.com/docs/reference/configuration/
#   https://geminicli.com/docs/cli/enterprise/
#   https://geminicli.com/docs/cli/telemetry/
[gemini]
format = "json"
notes = [
    "Gemini merges settings (arrays concatenate, objects merge); Praxis reports per-key precedence. Workspace .gemini/settings.json files sit between user and system settings and are not evaluated here.",
    "telemetry.logPrompts defaults to true when telemetry is enabled.",
]

[[gemini.sources]]
scope = "managed"
os = "linux"
path = "/etc/gemini-cli/settings.json"
env_override = "GEMINI_CLI_SYSTEM_SETTINGS_PATH"

[[gemini.sources]]
scope = "managed"
os = "macos"
path = "/Library/Application Support/GeminiCli/settings.json"
env_override = "GEMINI_CLI_SYSTEM_SETTINGS_PATH"

[[gemini.sources]]
scope = "managed"
os = "windows"
path = 'C:\ProgramData\gemini-cli\settings.json'
env_override = "GEMINI_CLI_SYSTEM_SETTINGS_PATH"

[[gemini.sources]]
scope = "user"
path = "~/.gemini/settings.json"

[[gemini.sources]]
scope = "defaults"
os = "linux"
path = "/etc/gemini-cli/system-defaults.json"
env_override = "GEMINI_CLI_SYSTEM_DEFAULTS_PATH"

[[gemini.sources]]
scope = "defaults"
os = "macos"
path = "/Library/Application Support/GeminiCli/system-defaults.json"
env_override = "GEMINI_CLI_SYSTEM_DEFAULTS_PATH"

[[gemini.sources]]
scope = "defaults"
os = "windows"
path = 'C:\ProgramData\gemini-cli\system-defaults.json'
env_override = "GEMINI_CLI_SYSTEM_DEFAULTS_PATH"

[gemini.telemetry]
enabled = ["telemetry.enabled", "$GEMINI_TELEMETRY_ENABLED"]
endpoints = ["telemetry.otlpEndpoint", "$GEMINI_TELEMETRY_OTLP_ENDPOINT"]
keys = [
    "telemetry.target",
    "telemetry.otlpProtocol",
    "telemetry.otlpHeaders",
    "telemetry.outfile",
    "telemetry.logPrompts",
    "telemetry.useCollector",
    "privacy.usageStatisticsEnabled",
    "$GEMINI_TELEMETRY_TARGET",
    "$GEMINI_TELEMETRY_OUTFILE",
    "$GEMINI_TELEMETRY_LOG_PROMPTS",
]

[gemini.sandbox]
keys = [
    "tools.sandbox",
    "general.defaultApprovalMode",
    "security.disableYoloMode",
    "admin.secureModeEnabled",
    "tools.core",
    "$GEMINI_SANDBOX",
    "$SEATBELT_PROFILE",
]

[gemini.categories]
tools = "permissions"
security = "permissions"
admin = "policy"
mcp = "mcp"
mcpServers = "mcp"
hooksConfig = "hooks"
model = "model"
telemetry = "telemetry"
privacy = "telemetry"

# Google Antigravity CLI (agy)
