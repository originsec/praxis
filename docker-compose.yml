#
# Praxis Docker Compose Configuration
# Includes RabbitMQ and Praxis services.
#
# Usage:
#   docker compose up --build
#
# Access:
#   Web UI: http://localhost:8080
#   RabbitMQ Management: http://localhost:15672 (praxis/praxis)
#
# Environment Variables:
#   PRAXIS_RABBITMQ_URL - RabbitMQ connection URL
#                         Default: amqp://praxis:praxis@localhost:5672
#   PRAXIS_NOT_HIDDEN=1 - Disable hidden desktop for agent windows (Windows only)
#                         Useful for debugging/testing DevTools-based agents
#

services:
  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: praxis
      RABBITMQ_DEFAULT_PASS: praxis
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  praxis:
    build: .
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      PRAXIS_RABBITMQ_URL: amqp://praxis:praxis@rabbitmq:5672
      RUST_LOG: info
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  rabbitmq_data:
